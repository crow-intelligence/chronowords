[project]
name = "chronowords"
version = "0.3.0"
description = "Detect semantic shifts in word embeddings over time"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    {name = "Orsolya Putz", email = "orsolya.putz@crowintelligence.org"},
    {name = "Zoltan Varju", email = "zoltan.varju@crowintelligence.org"},
]
keywords = ["nlp", "embeddings", "semantic-change", "topic-modeling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14.1,<2",
    "scikit-learn>=1.6.1,<2",
]

[project.urls]
Homepage = "https://github.com/crow-intelligence/chronowords"
Repository = "https://github.com/crow-intelligence/chronowords"
Documentation = "https://chronowords.readthedocs.io/en/latest/"
Organization = "https://crowintelligence.org/"

[dependency-groups]
bench = [
    "pyarrow>=25.0.1",
]
dev = [
    "pytest>=8.3.4",
    "hypothesis>=6.100",
    "pre-commit>=4.1.0",
    "ruff>=0.9.4",
    "ty",
    "scipy-stubs>=1.15.1.0",
]
# The example notebook and the scripts that rebuild data/corpus. Skipped on
# Python 3.15 for now: spaCy and altair's dependency rpds-py have no 3.15
# builds yet.
examples = [
    "notebook>=7.3.2; python_version < '3.15'",
    "pandas>=2.2.3; python_version < '3.15'",
    "altair>=5.5.0; python_version < '3.15'",
    "requests>=2.32.3; python_version < '3.15'",
    "spacy>=3.8.4; python_version < '3.15'",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "chronowords._core"
manifest-path = "rust/Cargo.toml"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "ERA", # eradicate (commented-out code)
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D203",  # One blank line before class (conflicts with D211)
    "D213",  # Multi-line summary second line (conflicts with D212)
    "A001",  # Built-in shadowing
    "RUF005",  # Unpack instead of concatenation
    "D200",  # One-line docstring should fit on one line
    "E501",  # Line too long
    "D205",  # Blank line required between summary and description
    "N806",  # Variable name should be lowercase
]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["chronowords"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
