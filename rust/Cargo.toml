[package]
name = "chronowords-core"
version = "0.4.0-dev"
edition = "2021"
license = "MIT"
description = "Counting and PPMI kernels for chronowords"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
rustc-hash = "2"
unicode-segmentation = "1.13"
rayon = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
