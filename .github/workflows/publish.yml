name: Publish

# On a published GitHub release: build every wheel and the sdist (wheels.yml),
# then upload them all to PyPI. Wheels are what make `pip install chronowords`
# work without a Rust toolchain.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/wheels.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }} dist/*
