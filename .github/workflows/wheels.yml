name: Wheels

# Builds abi3 wheels (one per platform, valid for CPython >= 3.13) and the
# sdist, and uploads them as workflow artifacts. Nothing is published here;
# publish.yml calls this workflow and uploads the artifacts to PyPI.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux containers carry several Pythons; build against the abi3 floor
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, interpreter: -i python3.13 }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, interpreter: -i python3.13 }
          - { os: macos-latest, target: aarch64 }
          # Intel macOS is cross-compiled on the arm64 runner
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist ${{ matrix.interpreter }}

      - name: Smoke-test the wheel
        # only where the runner can execute the wheel it built
        if: (runner.os == 'Linux' && matrix.target == 'x86_64') || (runner.os == 'macOS' && matrix.target == 'aarch64') || runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from chronowords.utils import count_cooccurrences as c; r = c(['cat dog'] * 3, min_count=1); assert (r.vocabulary, r.pair_counts.tolist()) == (['cat', 'dog'], [3]); print('ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
